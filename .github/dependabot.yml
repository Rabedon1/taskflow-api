# Dependabot revisa cada semana si hay versiones nuevas y abre un PR por cada
# actualización. Ese PR pasa por el pipeline completo (pruebas, escaneos),
# así que una actualización que rompa algo nunca llega a main.
version: 2
updates:
  # Dependencias Java del pom.xml (Spring Boot, Testcontainers, plugins...).
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Parches y versiones menores juntos en un solo PR, para no inundar de PRs.
      maven-minor-and-patch:
        update-types: [minor, patch]

  # Acciones de GitHub: actualiza el SHA fijado Y el comentario "# vX.Y.Z".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Imagen base del Dockerfile (eclipse-temurin:17-jre@sha256:...): actualiza el digest.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
