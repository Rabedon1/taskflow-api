# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 · CI — workflow REUTILIZABLE (lo invoca pipeline.yml).
#
# Responsabilidad: probar que el código es correcto y producir el JAR.
#   ./mvnw verify = pruebas unitarias + integración (PostgreSQL real con
#   Testcontainers) + formato (Spotless) + análisis estático (SpotBugs) +
#   cobertura mínima 80 % (JaCoCo). Es el MISMO comando que corres en local.
#
# Salida: artefacto "app-jar". Es la semilla de "construir una vez": la imagen
# Docker se armará con ESTE JAR ya probado, no con uno recompilado.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  workflow_call:

# Permisos mínimos: este workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No dejar el token guardado en .git/config: ningún paso posterior lo necesita.
          persist-credentials: false

      - name: Set up JDK 17 (Temurin) with Maven cache
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test and quality gates
        run: ./mvnw -B -ntp verify

      - name: Upload application JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          # Solo el JAR ejecutable (Spring Boot deja también *.jar.original, que no sirve).
          path: target/taskflow-api-*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and coverage reports
        if: always() # también (sobre todo) cuando algo falla: para ver POR QUÉ falló
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
