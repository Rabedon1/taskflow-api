# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 · DOCKER — workflow REUTILIZABLE (lo invoca pipeline.yml).
#
# Responsabilidad: construir la imagen UNA sola vez a partir del JAR que ya
# pasó CI (artefacto app-jar). No se recompila nada: el binario que va dentro
# de la imagen es exactamente el que pasó las pruebas.
#
# Por ahora la imagen queda cargada en el runner y NO se publica. En las
# etapas siguientes: se escanea con Trivy (seguridad) y, solo si está limpia
# y el evento es un push a main, se publica en GHCR y se expone su digest.
# ─────────────────────────────────────────────────────────────────────────────
name: Docker

on:
  workflow_call:
    inputs:
      push:
        description: "true solo en push a main: habilita el tag 'main' (y, más adelante, la publicación)"
        type: boolean
        default: false
    outputs:
      tag:
        description: "Referencia inmutable por commit: ghcr.io/rabedon1/taskflow-api:sha-<7>"
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: "Digest de la imagen publicada (sha256:...). Vacío si push es false."
        value: ${{ jobs.build.outputs.digest }}
      image:
        description: "Referencia por digest: ghcr.io/rabedon1/taskflow-api@sha256:... Vacía si push es false."
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

env:
  # Los nombres de imagen en un registro deben ir en minúsculas.
  IMAGE_NAME: ghcr.io/rabedon1/taskflow-api

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Subir el reporte SARIF de Trivy a la pestaña Security.
      security-events: write
      # Publicar la imagen en GHCR (GitHub Container Registry).
      packages: write
      # Firmar la attestation de procedencia: GitHub emite un token OIDC
      # de corta duración que prueba "este run de este repo construyó esto".
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Checkout (Dockerfile y .dockerignore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested JAR from CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Calcula tags y metadatos a partir del contexto de GitHub (commit, rama, fecha).
      #   sha-<7>: siempre — identifica el commit exacto.
      #   main   : solo en push a main — "lo último integrado" (se mueve).
      - name: Compute tags and metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ inputs.push }}

      - name: Build image (load into the runner, no push yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          # Los labels OCI los escribe el Dockerfile con estos valores reales.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          # Caché de capas en GitHub Actions: la capa de Java (~300 MB) no se
          # vuelve a descargar en cada run; solo cambia la capa del JAR.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Expose the immutable commit tag
        id: ref
        env:
          VERSION: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
        run: echo "tag=${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"

      # Comprobaciones rápidas sobre la imagen construida: que no corra como
      # root y que lleve el commit correcto en sus labels (trazabilidad).
      - name: Check image user and traceability labels
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' "$TAG")
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$TAG")
          echo "image:    $TAG"
          echo "user:     $user"
          echo "revision: $revision"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::La imagen corre como root"; exit 1
          fi
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::El label revision ($revision) no coincide con el commit ($GITHUB_SHA)"; exit 1
          fi

      # ── Escaneo de vulnerabilidades ANTES de publicar ──────────────────────
      # Trivy revisa los paquetes del sistema operativo de la imagen (Ubuntu)
      # y las librerías Java dentro del JAR contra bases de CVE públicas.
      # Bloquea si hay algo CRÍTICO o ALTO que ya tenga parche disponible
      # (ignore-unfixed: un CVE sin parche no se puede arreglar subiendo versión;
      # bloquear por él dejaría el pipeline rojo sin nada que hacer).
      - name: Scan image for vulnerabilities (blocking)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ steps.ref.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Mismo escaneo en formato SARIF para la pestaña Security → Code scanning.
      # if: always() → también (sobre todo) cuando el paso anterior falló,
      # para ver los hallazgos en la interfaz de GitHub.
      - name: Generate SARIF report
        if: always() && steps.ref.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ steps.ref.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always() && steps.ref.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # ── Publicación: SOLO en push a main y SOLO si todo lo anterior pasó ──
      # (los steps sin "if: always()" no corren si un paso previo falló, así
      # que una imagen que Trivy rechazó nunca llega a este punto).
      # Se publica la MISMA imagen que se construyó y escaneó: no hay un
      # segundo build, solo se suben las capas que ya están en el runner.
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # El token automático del run basta (packages: write): no hace falta
          # un token personal guardado como secreto.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and read its digest
        id: publish
        if: inputs.push
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          docker push --all-tags "$IMAGE_NAME"
          # RepoDigests = "ghcr.io/rabedon1/taskflow-api@sha256:..." (lo asigna
          # el registro al recibir la imagen). Nos quedamos con lo que va tras "@".
          repo_digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$TAG")
          digest="${repo_digest#*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Digest inesperado: '$repo_digest'"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE_NAME}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      # Attestation de procedencia (SLSA): un certificado firmado que dice
      # "la imagen con este digest la construyó el workflow X, del repo Y,
      # en el commit Z". Se guarda junto a la imagen en el registro.
      - name: Attest build provenance
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
