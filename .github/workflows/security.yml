# ─────────────────────────────────────────────────────────────────────────────
# SEGURIDAD de la cadena de suministro — workflow REUTILIZABLE (lo invoca
# pipeline.yml, en paralelo con CI).
#
#   dependency-review : ¿este PR AGREGA una dependencia con vulnerabilidades
#                       conocidas (CVE) de severidad alta o crítica?
#   secret-scan       : ¿hay contraseñas, tokens o claves en el código o en
#                       CUALQUIER commit del historial?
#
# La imagen Docker se escanea aparte (Trivy, en docker.yml), porque necesita
# la imagen ya construida.
# ─────────────────────────────────────────────────────────────────────────────
name: Security

on:
  workflow_call:

permissions:
  contents: read

env:
  # Gitleaks se descarga del release oficial con versión fija y su SHA-256
  # escrito aquí (verificado a mano contra checksums.txt del release).
  # Si el archivo descargado no coincide byte a byte, el job se detiene
  # ANTES de ejecutarlo. Para actualizar: cambiar ambos valores juntos.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  dependency-review:
    name: dependency-review
    # Compara las dependencias del PR contra las de main: solo tiene sentido en un PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: un secreto borrado en un commit posterior
          # sigue existiendo en el commit donde se agregó.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (pinned version, verified checksum)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan the whole git history for secrets
        # --redact: si encuentra algo, NO imprime el secreto en el log (los
        # logs de un repo público los puede leer cualquiera).
        run: ./gitleaks git --redact --exit-code 1 --verbose .
